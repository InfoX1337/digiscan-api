[project]
name = "formproof"
version = "0.1.0"
description = "Konwersja formularzy (PDF/obraz/DOCX/DOC/XLSX/ODS) do JSON kreatora eUsług COI z dowodem pochodzenia i walidacją."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.165.0",
    "jsonata-python>=0.7.2",
    "jsonschema>=4.26.0",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.11",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formproof"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

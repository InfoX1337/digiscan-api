services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env  # opcjonalny; bez niego działają wartości domyślne (tryb demo)
        required: false
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on: [ollama]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.40.17
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    # model pobierany raz: docker compose exec ollama ollama pull ${LLM_MODEL:-qwen3.5:4b}
volumes:
  ollama: {}
